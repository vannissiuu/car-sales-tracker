name: Probe News Sources (P3)

# 手动点击触发（用户会在 GitHub 网页上点 Run workflow）；
# 同时保留 push 触发（限定只在改动本工作流文件时），方便首次把这个文件推上去就自动跑一次。
# commit-back 步骤的提交信息带 [skip ci]，GitHub Actions 会跳过由该次 push 触发的工作流，
# 避免"探针提交结果 -> 触发 push -> 又跑一次探针"的死循环——沿用 P1 sync.yml 的口径。
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/probe_news.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # 探针的价值就在于诚实记录"哪些源打不通/被拦截"，这本身就是结论而不是流程故障，
    # 不应该让整个 job 显示失败——沿用 P1 sync.yml 的口径。
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml pandas feedparser

      - name: Write probe script
        run: |
          cat > probe_news.py << 'PROBE_SCRIPT_EOF'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """
          P3 探针：验证「按品牌/车型抓取新闻」候选数据源在生产环境（GitHub Actions，
          出口 IP 在美国弗吉尼亚 Azure，已知能访问中国网站）下是否真的可用。

          背景 / 已知事实（不重复踩坑）：
            - dongchedi.com / cpcaauto.com / caam.org.cn 已确认不可用（出网白名单拦截 /
              滑块验证码），本探针不测这几个。
            - xl.16888.com（车主之家销量页）已验证可用、静态 HTML、无反爬，是 P1 sync.py
              的数据源。本探针额外测车主之家的资讯子域 news.16888.com，同域名家族，
              是否也一样好抓。
            - 本探针只做"调研阶段的一次性验证"，不是生产管道：不做幂等、不做增量、
              没有 append/skip 逻辑，每次跑都是全量重测 8 个候选 URL。

          本探针要做的事（对每个候选 URL）：
            1. 用浏览器 UA 发起 GET 请求，请求间隔 3 秒，记录状态码 / 耗时 / 声明编码 /
               实际编码 / 字节数 / 最终 URL（有无重定向）/ Content-Type。
            2. 原始响应内容全量保存到 probe_news_output/raw/ 下，供解析失败时人工重写解析器。
            3. 用多种策略尝试提取新闻条目（标题/链接/日期/来源）：
                 a) feedparser 按 RSS/Atom 解析（如果像 feed 就会有 entries）
                 b) pandas.read_html 找表格（新闻列表一般不是表格，但按用户要求也测一下，
                    做诚实的"试了、没有表格"记录）
                 c) BeautifulSoup 通用新闻列表启发式：找 <a> 标签里文本长度像标题的，
                    再在其父节点/兄弟节点里找日期形状的文本
            4. 每个候选写一条 JSON 结果 + 汇总进 REPORT.md，人工可读地回答：
                 能不能访问 / 是不是 RSS / 提取到几条 / 标题·链接·日期是否齐全 /
                 URL 能不能按品牌构造。

          诚实声明：这些候选 URL 有的是网页搜索结果里直接确认存在的（比如
          tags.sina.com.cn/brand_wenjie、news.mydrivers.com/tag/biyadi.htm），
          有的是按同一套命名规律"推测"出来的拼音 slug（比如 brand_biyadi、
          tag/wenjie.htm）——本探针跑完后 REPORT.md 会明确标注每一条究竟是
          "搜索确认存在" 还是 "推测，未搜索确认"，见 CANDIDATES 里的 confidence 字段。
          """

          import json
          import os
          import re
          import sys
          import time
          import traceback
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          import requests

          try:
              import feedparser
          except Exception:
              feedparser = None

          try:
              import pandas as pd
          except Exception:
              pd = None

          from bs4 import BeautifulSoup

          COMMON_UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          )

          REQUEST_HEADERS = {
              "User-Agent": COMMON_UA,
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          }

          REQUEST_TIMEOUT_SECONDS = 20
          SLEEP_BETWEEN_REQUESTS_SECONDS = 3

          BLOCK_MARKERS = [
              "验证码", "captcha", "人机验证", "安全验证", "访问异常",
              "拒绝访问", "禁止访问", "blocked", "Access Denied", "a_bogus",
          ]

          # 测试品牌：老牌(比亚迪) / 新势力(问界) / 跨界(小米汽车)
          BRAND_BYD = "比亚迪"
          BRAND_AITO = "问界"
          BRAND_XIAOMI = "小米汽车"

          # ============================================================
          # 候选源清单。confidence 字段如实标注：
          #   "search_confirmed" = WebSearch 结果里直接命中了这个 URL 或同结构的姊妹 URL
          #   "inferred_pattern" = 按同站已确认的命名规律推测出来的（同一套 pinyin/结构），
          #                        没有被搜索直接命中过，很可能 404，探针就是要验它
          # ============================================================
          CANDIDATES = [
              {
                  "id": "16888_news_home",
                  "source": "车主之家资讯 news.16888.com（首页/列表结构侦察）",
                  "url": "https://news.16888.com/",
                  "brand": None,
                  "confidence": "search_confirmed",
                  "note": (
                      "与已验证可用的 xl.16888.com 同域名家族（16888.com）。搜索确认该子域"
                      "存在且有新闻列表，但没搜到明确的『按品牌筛选』入口，本条只是用来"
                      "侦察页面结构（是否有 tag/搜索/品牌筛选功能可用），不代表能按品牌构造 URL。"
                  ),
              },
              {
                  "id": "16888_news_category_qcwh",
                  "source": "车主之家资讯 news.16888.com 分类列表页样例（汽车文化分类）",
                  "url": "https://news.16888.com/qcwh/index_list_9.html",
                  "brand": None,
                  "confidence": "search_confirmed",
                  "note": "搜索直接命中的分类列表页，URL 形如 /<分类拼音缩写>/index_list_<N>.html，用于确认列表页 HTML 结构、翻页方式，为后续人工找品牌入口探路。",
              },
              {
                  "id": "sina_tagsnews_byd",
                  "source": "新浪汽车旧版标签聚合 tags.news.sina.com.cn（中文原词）",
                  "url": "https://tags.news.sina.com.cn/%E6%AF%94%E4%BA%9A%E8%BF%AA",  # 比亚迪
                  "brand": BRAND_BYD,
                  "confidence": "search_confirmed",
                  "note": "搜索直接命中：『比亚迪 - 最新比亚迪实时滚动快讯...』标题的标签聚合页，URL 是中文品牌名直接 percent-encode，理论上可以对任意品牌名直接构造。",
              },
              {
                  "id": "sina_tags_brand_wenjie",
                  "source": "新浪汽车新版标签聚合 tags.sina.com.cn/brand_<拼音>",
                  "url": "https://tags.sina.com.cn/brand_wenjie",
                  "brand": BRAND_AITO,
                  "confidence": "search_confirmed",
                  "note": "搜索直接命中：『问界 - 最新问界实时滚动快讯...』，URL 是纯 ASCII 拼音，比中文 URL 更适合批量构造（不用处理编码）。同一套系统下还搜到 tags.sina.com.cn/model_qinplus（车型级）。",
              },
              {
                  "id": "sina_tags_model_xiaomiqiche",
                  "source": "新浪汽车新版标签聚合 tags.sina.com.cn/model_<拼音>",
                  "url": "https://tags.sina.com.cn/model_xiaomiqiche",
                  "brand": BRAND_XIAOMI,
                  "confidence": "search_confirmed",
                  "note": "搜索直接命中：『小米汽车 - 最新小米汽车实时滚动快讯...』。注意小米汽车用的是 model_ 前缀而不是 brand_ 前缀，说明 brand_/model_ 的划分不完全等于我们业务上的『品牌』概念，需要探针实测两种前缀。",
              },
              {
                  "id": "sina_tags_brand_biyadi_guess",
                  "source": "新浪汽车新版标签聚合 tags.sina.com.cn/brand_biyadi（推测）",
                  "url": "https://tags.sina.com.cn/brand_biyadi",
                  "brand": BRAND_BYD,
                  "confidence": "inferred_pattern",
                  "note": "按 brand_wenjie 的命名规律推测比亚迪应该是 brand_biyadi，没有被搜索直接命中，可能 404 或需要别的 slug（比如带后缀），探针就是要验证。",
              },
              {
                  "id": "mydrivers_tag_biyadi",
                  "source": "快科技（mydrivers）news.mydrivers.com/tag/<拼音>.htm",
                  "url": "https://news.mydrivers.com/tag/biyadi.htm",
                  "brand": BRAND_BYD,
                  "confidence": "search_confirmed",
                  "note": "搜索直接命中『比亚迪最新资讯-快科技』及子车型页 biyadisong.htm（比亚迪宋），说明这套 tag 系统精细到车型级，URL 全 ASCII 拼音。快科技是综合科技媒体不是汽车垂直站，但确实有独立汽车频道。",
              },
              {
                  "id": "mydrivers_tag_wenjie_guess",
                  "source": "快科技 news.mydrivers.com/tag/wenjie.htm（推测）",
                  "url": "https://news.mydrivers.com/tag/wenjie.htm",
                  "brand": BRAND_AITO,
                  "confidence": "inferred_pattern",
                  "note": "按 biyadi.htm 的命名规律推测问界是 wenjie.htm，没有被搜索命中过，问界是 2022 年才出现的新品牌，快科技这套 tag 系统是否覆盖到未知，探针验证。",
              },
              {
                  "id": "d1ev_search_byd",
                  "source": "第一电动 d1ev.com 站内搜索 /search?q=<关键词>",
                  "url": "https://d1ev.com/search?q=%E6%AF%94%E4%BA%9A%E8%BF%AA",  # 比亚迪
                  "brand": BRAND_BYD,
                  "confidence": "search_confirmed",
                  "note": "搜索命中了同结构的 /search?q=蔚来、/search?q=汽车，说明 q= 参数可以放任意关键词（含品牌名），是新能源垂直媒体，对比亚迪/问界/小米汽车这类新能源相关品牌覆盖度应该不错。",
              },
          ]

          OUTPUT_DIR = os.path.join(os.getcwd(), "probe_news_output")
          RAW_DIR = os.path.join(OUTPUT_DIR, "raw")
          RESULTS_JSON = os.path.join(OUTPUT_DIR, "results.json")
          REPORT_MD = os.path.join(OUTPUT_DIR, "REPORT.md")

          DATE_PATTERNS = [
              re.compile(r"20\d{2}-\d{1,2}-\d{1,2}"),
              re.compile(r"20\d{2}年\d{1,2}月\d{1,2}日"),
              re.compile(r"20\d{2}/\d{1,2}/\d{1,2}"),
              re.compile(r"\d{1,2}-\d{1,2}\s+\d{1,2}:\d{2}"),
              re.compile(r"\d{1,2}月\d{1,2}日"),
              re.compile(r"\d{1,2}:\d{2}"),
          ]


          def looks_blocked(text):
              if not text:
                  return False
              head = text[:3000]
              return any(marker in head for marker in BLOCK_MARKERS)


          def find_date_near(tag):
              """在给定标签本身、其父节点、其后 2 个兄弟节点的文本里找日期形状的字符串。"""
              candidates_text = []
              candidates_text.append(tag.get_text(" ", strip=True))
              if tag.parent is not None:
                  candidates_text.append(tag.parent.get_text(" ", strip=True))
              sib = tag.find_next_sibling()
              hops = 0
              while sib is not None and hops < 2:
                  candidates_text.append(sib.get_text(" ", strip=True))
                  sib = sib.find_next_sibling()
                  hops += 1
              for text in candidates_text:
                  for pat in DATE_PATTERNS:
                      m = pat.search(text)
                      if m:
                          return m.group(0)
              return None


          def extract_via_bs4_heuristic(html, base_url, max_items=20):
              """通用新闻列表启发式：<a> 标签文本长度像标题的，配对最近的日期形状文本。"""
              items = []
              try:
                  soup = BeautifulSoup(html, "lxml")
              except Exception:
                  soup = BeautifulSoup(html, "html.parser")

              seen_links = set()
              for a in soup.find_all("a", href=True):
                  title = a.get_text(" ", strip=True)
                  href = a["href"]
                  if not title or len(title) < 8 or len(title) > 120:
                      continue
                  if href.startswith("javascript:") or href.startswith("#"):
                      continue
                  if href in seen_links:
                      continue
                  seen_links.add(href)
                  date_str = find_date_near(a)
                  items.append({"title": title, "link": href, "date": date_str})
                  if len(items) >= max_items:
                      break
              return items


          def extract_via_feedparser(raw_bytes):
              if feedparser is None:
                  return None, "feedparser 未安装"
              try:
                  parsed = feedparser.parse(raw_bytes)
              except Exception as e:
                  return None, f"feedparser 解析异常: {e}"
              if not parsed.entries:
                  return None, "feedparser 解析出 0 条 entries（大概率不是 RSS/Atom）"
              entries = []
              for e in parsed.entries[:20]:
                  entries.append({
                      "title": getattr(e, "title", None),
                      "link": getattr(e, "link", None),
                      "date": getattr(e, "published", getattr(e, "updated", None)),
                  })
              feed_title = getattr(parsed.feed, "title", None) if hasattr(parsed, "feed") else None
              return {"feed_title": feed_title, "entries": entries, "total_entries": len(parsed.entries)}, None


          def extract_via_pandas_tables(html):
              if pd is None:
                  return None, "pandas 未安装"
              try:
                  tables = pd.read_html(io_wrap(html))
              except Exception as e:
                  return None, f"pandas.read_html 未找到表格或解析失败: {e}"
              return {
                  "table_count": len(tables),
                  "shapes": [list(t.shape) for t in tables[:10]],
              }, None


          def io_wrap(html):
              import io
              return io.StringIO(html)


          def safe_filename(cand_id, content_type):
              ext = "html"
              if content_type and ("xml" in content_type or "rss" in content_type):
                  ext = "xml"
              return f"{cand_id}.{ext}"


          def probe_one(cand):
              result = {
                  "id": cand["id"],
                  "source": cand["source"],
                  "url": cand["url"],
                  "brand": cand["brand"],
                  "confidence": cand["confidence"],
                  "note": cand["note"],
                  "requested_at": datetime.now(timezone.utc).isoformat(),
              }

              start = time.monotonic()
              try:
                  resp = requests.get(
                      cand["url"],
                      headers=REQUEST_HEADERS,
                      timeout=REQUEST_TIMEOUT_SECONDS,
                      allow_redirects=True,
                  )
              except Exception as e:
                  result["ok"] = False
                  result["error"] = f"{type(e).__name__}: {e}"
                  result["elapsed_ms"] = int((time.monotonic() - start) * 1000)
                  return result

              elapsed_ms = int((time.monotonic() - start) * 1000)
              content_type = resp.headers.get("Content-Type", "")

              result["ok"] = True
              result["status_code"] = resp.status_code
              result["elapsed_ms"] = elapsed_ms
              result["final_url"] = resp.url
              result["redirected"] = (urlparse(resp.url).path != urlparse(cand["url"]).path
                                       or urlparse(resp.url).netloc != urlparse(cand["url"]).netloc)
              result["content_type"] = content_type
              result["apparent_encoding"] = resp.apparent_encoding
              result["declared_encoding"] = resp.encoding
              result["content_bytes"] = len(resp.content)

              # 保存原始内容——不管后面解析成不成功，这份都留着给人工重写解析器用
              os.makedirs(RAW_DIR, exist_ok=True)
              raw_path = os.path.join(RAW_DIR, safe_filename(cand["id"], content_type))
              try:
                  with open(raw_path, "wb") as f:
                      f.write(resp.content)
                  result["raw_saved_to"] = os.path.relpath(raw_path, OUTPUT_DIR)
              except Exception as e:
                  result["raw_saved_to"] = None
                  result["raw_save_error"] = str(e)

              resp.encoding = resp.apparent_encoding or resp.encoding
              text = resp.text

              result["looks_blocked"] = looks_blocked(text)

              # 策略 a: RSS/Atom
              rss_result, rss_err = extract_via_feedparser(resp.content)
              result["rss_parse"] = rss_result
              result["rss_parse_error"] = rss_err
              result["is_rss_like"] = rss_result is not None

              # 策略 b: pandas 表格
              if resp.status_code == 200 and not result["looks_blocked"]:
                  table_result, table_err = extract_via_pandas_tables(text)
              else:
                  table_result, table_err = None, "跳过（状态码非200或疑似被拦截）"
              result["pandas_tables"] = table_result
              result["pandas_tables_error"] = table_err

              # 策略 c: BeautifulSoup 启发式新闻列表
              if resp.status_code == 200 and not result["looks_blocked"]:
                  try:
                      bs4_items = extract_via_bs4_heuristic(text, cand["url"])
                  except Exception as e:
                      bs4_items = []
                      result["bs4_heuristic_error"] = f"{type(e).__name__}: {e}"
              else:
                  bs4_items = []
              result["bs4_heuristic_items"] = bs4_items
              result["bs4_heuristic_count"] = len(bs4_items)

              # 汇总一个"最佳提取结果"，方便报告里一眼看出这个源到底能不能提取新闻
              if result["is_rss_like"]:
                  result["best_extraction"] = "rss"
                  result["best_extraction_count"] = rss_result["total_entries"]
              elif len(bs4_items) > 0:
                  result["best_extraction"] = "bs4_heuristic"
                  result["best_extraction_count"] = len(bs4_items)
              else:
                  result["best_extraction"] = "none"
                  result["best_extraction_count"] = 0

              return result


          def field_completeness(items):
              if not items:
                  return {"title": 0, "link": 0, "date": 0, "total": 0}
              total = len(items)
              return {
                  "title": sum(1 for it in items if it.get("title")),
                  "link": sum(1 for it in items if it.get("link")),
                  "date": sum(1 for it in items if it.get("date")),
                  "total": total,
              }


          def render_report(all_results):
              lines = []
              lines.append("# P3 新闻源探针报告")
              lines.append("")
              lines.append(f"生成时间（UTC）：{datetime.now(timezone.utc).isoformat()}")
              lines.append("")
              lines.append(
                  "本报告由 GitHub Actions runner（美国弗吉尼亚 Azure 出口 IP）实测生成。"
                  "容器本地（本次调研所在的沙箱环境）无法访问中国网站，"
                  "所以这份报告是唯一的真实连通性依据，调研阶段的判断仅供参考。"
              )
              lines.append("")
              lines.append("## 汇总表")
              lines.append("")
              lines.append("| id | 来源 | 品牌 | 可靠度(调研阶段) | HTTP状态 | 疑似拦截 | 是否RSS | 提取条数 | 标题/链接/日期齐全 |")
              lines.append("|---|---|---|---|---|---|---|---|---|")
              for r in all_results:
                  if not r.get("ok"):
                      lines.append(
                          f"| {r['id']} | {r['source']} | {r.get('brand') or '-'} | "
                          f"{r['confidence']} | 请求失败: {r.get('error','')} | - | - | - | - |"
                      )
                      continue
                  comp = field_completeness(
                      r["rss_parse"]["entries"] if r.get("is_rss_like") else r.get("bs4_heuristic_items", [])
                  )
                  comp_str = f"{comp['title']}/{comp['link']}/{comp['date']} (共{comp['total']}条)"
                  lines.append(
                      f"| {r['id']} | {r['source']} | {r.get('brand') or '-'} | "
                      f"{r['confidence']} | {r['status_code']} ({r['elapsed_ms']}ms) | "
                      f"{'是' if r.get('looks_blocked') else '否'} | "
                      f"{'是' if r.get('is_rss_like') else '否'} | "
                      f"{r.get('best_extraction_count', 0)} ({r.get('best_extraction','none')}) | "
                      f"{comp_str} |"
                  )
              lines.append("")
              lines.append("## 逐个详情")
              lines.append("")
              for r in all_results:
                  lines.append(f"### {r['id']} — {r['source']}")
                  lines.append("")
                  lines.append(f"- URL: {r['url']}")
                  lines.append(f"- 测试品牌: {r.get('brand') or '（不针对具体品牌，用于结构侦察）'}")
                  lines.append(f"- 调研阶段可靠度: {r['confidence']}")
                  lines.append(f"- 调研备注: {r['note']}")
                  if not r.get("ok"):
                      lines.append(f"- **请求失败**: {r.get('error')}")
                      lines.append("")
                      continue
                  lines.append(f"- HTTP 状态码: {r['status_code']}，耗时 {r['elapsed_ms']}ms")
                  lines.append(f"- 最终 URL: {r['final_url']}（是否发生重定向: {'是' if r['redirected'] else '否'}）")
                  lines.append(f"- Content-Type: {r['content_type']}")
                  lines.append(f"- 编码: 声明={r['declared_encoding']}, 实测={r['apparent_encoding']}")
                  lines.append(f"- 响应字节数: {r['content_bytes']}")
                  lines.append(f"- 原始内容已保存: {r.get('raw_saved_to')}")
                  lines.append(f"- 疑似被拦截(验证码/访问异常等关键词): {'是' if r.get('looks_blocked') else '否'}")
                  lines.append(f"- RSS/Atom 解析: {'成功，' + str(r['rss_parse']['total_entries']) + ' 条' if r.get('is_rss_like') else '否 — ' + str(r.get('rss_parse_error'))}")
                  if r.get("pandas_tables"):
                      lines.append(f"- pandas.read_html: 找到 {r['pandas_tables']['table_count']} 个表格，形状 {r['pandas_tables']['shapes']}")
                  else:
                      lines.append(f"- pandas.read_html: {r.get('pandas_tables_error')}")
                  lines.append(f"- BeautifulSoup 启发式列表: 提取到 {r.get('bs4_heuristic_count', 0)} 条")
                  items = r["rss_parse"]["entries"] if r.get("is_rss_like") else r.get("bs4_heuristic_items", [])
                  if items:
                      lines.append("")
                      lines.append("  示例前 5 条：")
                      for it in items[:5]:
                          lines.append(f"  - 标题: {it.get('title')}")
                          lines.append(f"    链接: {it.get('link')}")
                          lines.append(f"    日期: {it.get('date')}")
                  lines.append("")

              lines.append("## 结论草稿（人工需要复核，这里只是把数据摆出来）")
              lines.append("")
              lines.append("- 能访问(HTTP 200 且未疑似拦截)的源: " + ", ".join(
                  r["id"] for r in all_results if r.get("ok") and r.get("status_code") == 200 and not r.get("looks_blocked")
              ) or "（无）")
              lines.append("- 确认是 RSS/Atom 的源: " + ", ".join(
                  r["id"] for r in all_results if r.get("is_rss_like")
              ) or "（无）")
              lines.append("- 提取到至少 1 条新闻的源: " + ", ".join(
                  r["id"] for r in all_results if r.get("best_extraction_count", 0) > 0
              ) or "（无）")
              lines.append("")

              return "\n".join(lines)


          def main():
              os.makedirs(OUTPUT_DIR, exist_ok=True)
              all_results = []
              for i, cand in enumerate(CANDIDATES):
                  print(f"[{i+1}/{len(CANDIDATES)}] 探测 {cand['id']} -> {cand['url']}", flush=True)
                  try:
                      r = probe_one(cand)
                  except Exception as e:
                      r = {
                          "id": cand["id"],
                          "source": cand["source"],
                          "url": cand["url"],
                          "brand": cand["brand"],
                          "confidence": cand["confidence"],
                          "note": cand["note"],
                          "ok": False,
                          "error": f"顶层未预期异常: {e}\n{traceback.format_exc()}",
                      }
                  all_results.append(r)
                  if i < len(CANDIDATES) - 1:
                      time.sleep(SLEEP_BETWEEN_REQUESTS_SECONDS)

              with open(RESULTS_JSON, "w", encoding="utf-8") as f:
                  json.dump(all_results, f, ensure_ascii=False, indent=2)

              report = render_report(all_results)
              with open(REPORT_MD, "w", encoding="utf-8") as f:
                  f.write(report)

              print("完成。结果见 probe_news_output/REPORT.md 和 probe_news_output/results.json")


          if __name__ == "__main__":
              try:
                  main()
              except Exception as e:
                  try:
                      os.makedirs(OUTPUT_DIR, exist_ok=True)
                      with open(os.path.join(OUTPUT_DIR, "FATAL_ERROR.txt"), "w", encoding="utf-8") as f:
                          f.write(f"顶层未预期异常:\n{e}\n\n{traceback.format_exc()}")
                  except Exception:
                      print(traceback.format_exc())
                  sys.exit(0)

          PROBE_SCRIPT_EOF

      - name: Run probe script
        # 脚本内部已经用 try/except 兜住了几乎所有异常，
        # 这里再加一层 continue-on-error 保险，确保后面的 commit/upload 步骤一定能跑
        continue-on-error: true
        run: python3 probe_news.py

      - name: Drop oversized raw files before commit
        if: always()
        continue-on-error: true
        run: |
          find probe_news_output/ -type f -size +20M -print -exec sh -c 'echo "文件过大已删除: $(basename "$1")" > "$1.toolarge.txt"; rm -f "$1"' _ {} \; || true

      - name: Commit probe results back to repo
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe_news_output/ || true
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: probe news sources (P3) [skip ci]"
            git push
          fi

      - name: Upload probe output
        # 关键：即使上面的步骤失败，也要执行这一步，
        # 否则运行失败时我们什么产出都拿不到
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-news-output
          path: probe_news_output/
          if-no-files-found: warn
          retention-days: 30
