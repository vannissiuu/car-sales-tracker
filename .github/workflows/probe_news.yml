name: Probe News Sources (P3)

# 手动点击触发（用户会在 GitHub 网页上点 Run workflow）；
# 同时保留 push 触发（限定只在改动本工作流文件时），方便首次把这个文件推上去就自动跑一次。
# commit-back 步骤的提交信息带 [skip ci]，GitHub Actions 会跳过由该次 push 触发的工作流，
# 避免"探针提交结果 -> 触发 push -> 又跑一次探针"的死循环——沿用 P1 sync.yml 的口径。
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/probe_news.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # 探针的价值就在于诚实记录"哪些源打不通/被拦截"，这本身就是结论而不是流程故障，
    # 不应该让整个 job 显示失败——沿用 P1 sync.yml 的口径。
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 lxml pandas feedparser

      # src/probe_news.py 现在是仓库里的普通文件，checkout 步骤已经把它拉下来了，
      # 不再需要在这里用 heredoc 把源码写出来；要改探针逻辑，直接改 src/probe_news.py 即可。
      - name: Run probe script
        # 脚本内部已经用 try/except 兜住了几乎所有异常，
        # 这里再加一层 continue-on-error 保险，确保后面的 commit/upload 步骤一定能跑
        continue-on-error: true
        run: python3 src/probe_news.py

      - name: Drop oversized raw files before commit
        if: always()
        continue-on-error: true
        run: |
          find probe_news_output/ -type f -size +20M -print -exec sh -c 'echo "文件过大已删除: $(basename "$1")" > "$1.toolarge.txt"; rm -f "$1"' _ {} \; || true

      - name: Commit probe results back to repo
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe_news_output/ || true
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: probe news sources (P3) [skip ci]"
            git push
          fi

      - name: Upload probe output
        # 关键：即使上面的步骤失败，也要执行这一步，
        # 否则运行失败时我们什么产出都拿不到
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-news-output
          path: probe_news_output/
          if-no-files-found: warn
          retention-days: 30
