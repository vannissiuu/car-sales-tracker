name: Build Car Sales Dashboard

# 手动点击触发，或者 sync 工作流跑完之后自动触发（sync 提交数据用 [skip ci]，
# 普通 push 触发会被挡掉，所以这里必须用 workflow_run 监听 sync 工作流本身的完成事件）。
# 注意：workflow_run 的 workflows 列表里必须填 sync 工作流 name 字段的准确值
# （即 /tmp/p1-sync/.github/workflows/sync.yml 第一行 name: 的值），
# 名字对不上这个触发器永远不会触发。
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Sync Car Sales Data (16888)"]
    types: [completed]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # 只在手动触发，或者 sync 工作流本次运行成功时才构建——
    # sync 失败/中止时不要拿残缺或过期的 data/sales.csv 去覆盖线上看板。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    # 这里曾经有一句 job 级的 continue-on-error: true，2026-09 去掉了。
    # 当时的理由是"后面的 commit/upload 步骤仍然要有机会跑"——但那件事是由步骤上的
    # if: always() 保证的，跟 continue-on-error 无关。job 级的 continue-on-error 唯一的
    # 作用就是把失败的 job 在界面上染成绿色。它造成过一次真实事故：build.py 因为
    # 「一车型对应两厂商」主动中止、看板整整停更，而 Actions 上一片绿，没人知道。
    # 现在的口径：这个 job 绿，当且仅当看板真的用当前数据重建并成功发布了。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 2026-09 修正的真 bug：这里原本写的是
          #     ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # 并注释说"确保拿到的是 sync 刚提交完 data/sales.csv 之后的那个 commit"。
          # 这句话是错的——workflow_run.head_sha 是触发方那次运行**开跑时**的 SHA，
          # 不是它跑完之后产出的提交。sync 先在 A 上开跑、再提交出 B，build 却去 checkout A，
          # 于是每次 sync 真的抓到新数据时，build 都拿不到那批数据、用旧数据重建看板，
          # 只把时间戳改新——看板永远慢一个月，而且时间戳还在撒谎。
          # 正确做法：checkout 分支最新提交（此时已经包含 sync 的数据提交）。
          # workflow_dispatch 手动触发时 workflow_run 上下文不存在，回退到 github.ref。
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # src/build.py 现在是仓库里的普通文件，checkout 步骤已经把它拉下来了，
      # 不再需要在这里用 heredoc 把源码写出来；要改构建逻辑，直接改 src/build.py 即可。
      - name: Run build script
        # build.py 内部对 ECharts 获取失败等情况已有多级回退（本地缓存 -> npm pack ->
        # CDN 直连 -> 最后回退成 <script src=CDN> 标签）。
        # 这里原本有一句 continue-on-error: true，2026-09 去掉了——它把 build.py 的主动
        # 中止（例如「数据假设被打破: 同一车型对应两个厂商」）吞成了成功。
        # 构建失败就该是红的；下面的 upload 步骤有 if: always()，产物照样能拿到。
        run: python3 src/build.py

      # 2026-09 新增的硬线：不让标签说谎。
      # 比对 data/sales.csv 的最大月份和刚构建出来的 docs/index.html 里写的「数据覆盖 … 至 X年Y月」，
      # 对不上就直接失败、并且不提交——宁可看板停在旧版本，也不要发布一个"时间戳是今天、
      # 数据是上个月"的产物。这道校验同时能挡住上面那类"拿旧提交构建"的问题。
      - name: Verify dashboard matches data
        run: |
          python3 - <<'PY'
          import csv, re, sys
          rows = list(csv.DictReader(open("data/sales.csv", encoding="utf-8")))
          if not rows:
              sys.exit("data/sales.csv 是空的")
          dy, dm = max((int(r["year"]), int(r["month"])) for r in rows)
          html = open("docs/index.html", encoding="utf-8").read()
          m = re.search(r"数据覆盖\s*(\d{4})年(\d{1,2})月\s*至\s*(\d{4})年(\d{1,2})月", html)
          if not m:
              sys.exit("在 docs/index.html 里找不到「数据覆盖 … 至 …」，无法校验，按失败处理")
          hy, hm = int(m.group(3)), int(m.group(4))
          print(f"data/sales.csv 最大月份 = {dy}-{dm:02d}")
          print(f"docs/index.html 覆盖到 = {hy}-{hm:02d}")
          if (hy, hm) != (dy, dm):
              sys.exit(
                  f"!! 产物与数据不一致：数据有 {dy}-{dm:02d}，但看板只到 {hy}-{hm:02d}。\n"
                  f"!! 常见原因：build.py 中途中止（看上一步日志），或 checkout 到了不含最新数据的提交。\n"
                  f"!! 本次不提交，线上看板保持原样。"
              )
          print("校验通过：看板覆盖范围与数据一致")
          PY

      - name: Commit dashboard back to repo
        # 两类失败在这里被显式处理：
        #
        # 1) detached HEAD（2026-09 修复的真 bug）。上面的 checkout 步骤用的是
        #    ref: <具体 SHA>，所以 workflow_run 链式触发时 git 处于 detached HEAD，
        #    不带参数的 `git push` 必然报 "You are not currently on a branch" 而失败。
        #    而 continue-on-error 会把整步吞成成功——表现就是：每月同步完之后自动构建
        #    "跑成功了"，但看板从来没被更新，必须有人手动去点一次 Run workflow
        #    （workflow_dispatch 触发时 ref 是分支名，才不会 detached）。
        #    修法：显式 `git push origin HEAD:<分支>`，detached 与否都成立。
        #
        # 2) 推送竞争。新闻探针等其它工作流可能同时往仓库推东西，撞上 non-fast-forward。
        #    失败就 fetch + rebase 到远端最新再试，最多 3 次，间隔递增。
        #    注意不能用 `git pull --rebase`：detached HEAD 下它没有上游分支可跟。
        #
        # 三次都失败时打印醒目的失败信息并 exit 1。2026-09 起这一步不再 continue-on-error：
        # 推不上去就等于没发布，必须红。构建产物由下面 if: always() 的 upload 步骤保底。
        # 去掉了原来的 if: always() 和 continue-on-error ——
        # 构建失败或一致性校验没过时，绝不把产物提交上去（默认的 success() 条件正合适）；
        # push 失败也要红，不能再静默。产物仍由下面 if: always() 的 upload 步骤保底。
        env:
          # workflow_run 触发时取触发方那次运行所在的分支；手动触发时取本次运行选的分支。
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -u
          BRANCH="${TARGET_BRANCH:-main}"
          echo "目标分支: $BRANCH"
          echo "当前 HEAD: $(git rev-parse --abbrev-ref HEAD)  ($(git rev-parse --short HEAD))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/ || true
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: build dashboard [skip ci]"
            PUSH_OK=0
            for i in 1 2 3; do
              if git push origin HEAD:"$BRANCH"; then
                echo "push 成功（第 $i 次尝试）"
                PUSH_OK=1
                break
              fi
              echo "push 失败（第 $i 次），fetch + rebase 到 origin/$BRANCH 后重试 ..."
              # 用 FETCH_HEAD 而不是 origin/$BRANCH：actions/checkout 是浅克隆 +
              # 定制 refspec，远端跟踪引用不一定被更新，FETCH_HEAD 一定是刚拉到的那个。
              git fetch origin "$BRANCH" || true
              git rebase FETCH_HEAD || git rebase --abort || true
              sleep $((i * 5))
            done
            if [ "$PUSH_OK" != "1" ]; then
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo "!! git push 连续 3 次失败，docs/ 的更新没有推送成功，仓库里看到的"
              echo "!! 还是旧看板。构建产物仍然在本次运行的 artifact 里，可以手动下载，"
              echo "!! 但需要人工介入排查为什么远端一直推不上去。"
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              exit 1
            fi
          fi

      - name: Upload build output
        # 关键：即使上面的步骤失败，也要执行这一步，
        # 否则运行失败时我们什么产出都拿不到
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-site
          path: docs/
          if-no-files-found: warn
          retention-days: 30
