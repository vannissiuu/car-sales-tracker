          echo "== base64 解码为 tar.gz =="
          base64 -d /tmp/archive.b64 > /tmp/archive.tar.gz
          ls -la /tmp/archive.tar.gz

          echo "== 安全检查：确认 tar 包里不包含受保护目录 =="
          tar -tzf /tmp/archive.tar.gz > /tmp/archive.filelist.txt
          PROTECTED_HIT=0
          for guard in 'data/' 'docs/' 'src/' '.github/' 'probe1_output/' 'probe2_output/' 'probe3_output/'; do
            if grep -q "^${guard}" /tmp/archive.filelist.txt; then
              echo "!!!!!! 危险：归档包里包含受保护路径 ${guard}，已终止，不会解包/不会写入仓库 !!!!!!"
              PROTECTED_HIT=1
            fi
          done
          if [ "$PROTECTED_HIT" = "1" ]; then
            echo "!! 安全检查未通过，中止本次归档。请检查打包脚本，不要重跑。"
            exit 1
          fi
          echo "安全检查通过：tar 包里只有以下顶层路径："
          cut -d/ -f1 /tmp/archive.filelist.txt | sort -u

          echo "== 记录解包前受保护目录的状态（用于解包后比对）=="
          git status --porcelain -- data/ docs/ src/ .github/ 'probe1_output' 'probe2_output' 'probe3_output' 2>/dev/null > /tmp/before_status.txt || true

          echo "== 解包到仓库根 =="
          mkdir -p /tmp/archive-unpack
          base64 -d /tmp/archive.b64 | tar xzf - -C /tmp/archive-unpack
          echo "解包出的文件列表（应为 21 个文件 + 目录）："
          find /tmp/archive-unpack -mindepth 1 | sort

          echo "== 中文文件名检查（docs-project/）=="
          ls /tmp/archive-unpack/docs-project/

          echo "== 拷贝到仓库根（只会新增/覆盖 tests/ tools/ docs-project/ README.md）=="
          cp -r /tmp/archive-unpack/. .

          echo "== 解包后复查：受保护目录是否被改动 =="
          git status --porcelain -- data/ docs/ src/ .github/ 'probe1_output' 'probe2_output' 'probe3_output' 2>/dev/null > /tmp/after_status.txt || true
          if ! diff -q /tmp/before_status.txt /tmp/after_status.txt > /dev/null 2>&1; then
            echo "!!!!!! 警告：受保护目录 (data/ docs/ src/ .github/ probe*_output/) 在解包前后状态不一致 !!!!!!"
            echo "-- 解包前 --"; cat /tmp/before_status.txt
            echo "-- 解包后 --"; cat /tmp/after_status.txt
            echo "!! 请人工检查，本步骤不会自动回滚，但不会阻止后续提交（避免整个 job 卡死）。"
          else
            echo "确认：data/ docs/ src/ .github/ probe*_output/ 均未被本次解包影响。"
          fi

          echo "== 本次将要提交的变更 =="
          git add -A tests/ tools/ docs-project/ README.md
          git status --porcelain -- tests/ tools/ docs-project/ README.md

      - name: 提交并推送归档文件
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/ tools/ docs-project/ README.md || true
          if git diff --staged --quiet; then
            echo "没有变化，跳过提交（可能是重复运行，文件已经归档过）"
          else
            git commit -m "chore: archive tests/tools/docs-project + README [skip ci]"
            PUSH_OK=0
            for i in 1 2 3; do
              if git push; then
                echo "push 成功"
                PUSH_OK=1
                break
              fi
              echo "push 失败（第 $i 次），拉取远端后重试 ..."
              git pull --rebase --autostash || true
              sleep $((i * 5))
            done
            if [ "$PUSH_OK" != "1" ]; then
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo "!! git push 连续 3 次失败，归档文件没有推送成功，仓库里还没有"
              echo "!! 出现 tests/ tools/ docs-project/ 和新 README.md。"
              echo "!! 需要人工介入排查为什么远端一直推不上去（很可能是分支保护规则）。"
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            fi
          fi

      - name: 归档结果小结
        if: always()
        run: |
          echo "== 归档完成后仓库根目录 =="
          ls -la
          echo "== tests/ =="
          ls -la tests/ 2>/dev/null || echo "(不存在，可能上面步骤失败了)"
          echo "== tools/ =="
          ls -la tools/ 2>/dev/null || echo "(不存在，可能上面步骤失败了)"
          echo "== docs-project/ =="
          ls -la docs-project/ 2>/dev/null || echo "(不存在，可能上面步骤失败了)"
          echo ""
          echo "这个 workflow 的任务到此结束。可以在 .github/workflows/archive.yml 里保留"
          echo "留作记录，也可以在网页上把这个文件删掉——不影响仓库里已经落地的 tests/ / tools/"
          echo "/ docs-project/ / README.md。"
