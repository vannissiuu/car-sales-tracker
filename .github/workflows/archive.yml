name: 一次性归档：测试 / 工具 / 文档 (P5)

# 这是一个「用一次就可以扔掉」的工作流。
#
# 背景：仓库之前只归档了核心源码（另一个改动负责，运行时自动落地到 src/），
# 还有一批文件——回归测试（tests/）、生成器工具（tools/）、项目文档（docs-project/）、
# 以及仓库根 README.md——目前只存在于开发用的临时容器里，容器一销毁就永久丢失了。
#
# 这个 workflow 把这些文件打成 tar.gz、base64 编码后整个内联在下面，
# 运行一次就会把它们解包写回仓库并提交，之后这个 workflow 留着不用，删掉也没关系。
#
# 使用方法（网页操作）：
#   1. 在 GitHub 网页上，进入仓库 -> Add file -> Create new file
#   2. 文件路径填 .github/workflows/archive.yml
#   3. 把这份文件的全部内容粘贴进去
#   4. 点击 Commit new file（commit 到 main / master 分支）
#   5. 提交后这个 workflow 会自动跑一次（见下面 push 触发条件），
#      跑完之后去仓库看 tests/ tools/ docs-project/ 和根目录 README.md 是否已经出现
#   6. 也可以在 Actions 标签页手动点 "Run workflow" 再跑一次（workflow_dispatch）
#
# 打包内容（tar.gz，共 21 个文件）：
#   tests/       —— 10 个回归测试脚本
#   tools/       —— 5 个生成器脚本
#   docs-project/ —— 5 份项目文档（其中 4 份用中文文件名）
#   README.md    —— 覆盖仓库根现有的占位 README
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/archive.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解包归档 (tar.gz + base64 内联)
